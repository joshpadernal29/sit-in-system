<!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Hybrid Theme Management Engine -->
    <script>
        const htmlElement = document.documentElement;
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        // Header Element Hooks
        const mainNavbar = document.getElementById('mainNavbar');
        const navbarLinks = document.getElementById('navbarLinks');
        const regBtn = document.getElementById('regBtn');

        // Check local storage or system preference on load
        const savedTheme = localStorage.getItem('theme');
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
        setTheme(initialTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-bs-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });

        function setTheme(theme) {
            htmlElement.setAttribute('data-bs-theme', theme);
            localStorage.setItem('theme', theme);

            if (theme === 'dark') {
                // 🌙 Transition to Sleek Dark Header Layout
                themeIcon.className = 'bi bi-sun-fill';
                themeToggleBtn.title = 'Switch to Light Mode';
                
                // Swap Navbar Container Classes
                mainNavbar.classList.remove('bg-primary', 'navbar-dark');
                mainNavbar.classList.add('bg-body-tertiary', 'navbar-light');
                
                // Fine-tune header link states and active underline tokens for dark mode visibility
                navbarLinks.style.setProperty('--bs-navbar-active-color', 'var(--bs-primary)');
                navbarLinks.style.setProperty('--bs-nav-underline-border-width', '3px');
                document.querySelectorAll('#navbarLinks .nav-link').forEach(link => {
                    link.classList.add('text-body-secondary');
                    link.classList.remove('text-white', 'text-white-50');
                });
                
                // Change register button to match dark styling smoothly
                regBtn.classList.remove('btn-light', 'text-primary');
                regBtn.classList.add('btn-primary');
                
                themeToggleBtn.classList.remove('text-white');
                themeToggleBtn.classList.add('text-body');
                
                document.querySelector('.navbar-brand .lh-1 span').className = 'fw-bold d-block mb-0 h6 text-body';
                document.querySelector('.navbar-brand .lh-1 small').className = 'text-body-secondary text-uppercase fw-semibold';
                document.querySelector('.collapse data-grid a[href="login.php"]')?.classList.replace('text-white', 'text-body');

            } else {
                // ☀️ Snap back to the Original UC Blue Layout
                themeIcon.className = 'bi bi-moon-stars-fill';
                themeToggleBtn.title = 'Switch to Dark Mode';
                
                // Revert Navbar Background Container
                mainNavbar.classList.remove('bg-body-tertiary', 'navbar-light');
                mainNavbar.classList.add('bg-primary', 'navbar-dark');
                
                // Revert Underline Properties to crisp white
                navbarLinks.style.setProperty('--bs-navbar-active-color', '#fff');
                navbarLinks.style.setProperty('--bs-nav-underline-border-width', '3px');
                document.querySelectorAll('#navbarLinks .nav-link').forEach(link => {
                    link.classList.remove('text-body-secondary');
                    link.classList.add('text-white-50'); // Inactive links go slightly translucent white
                });
                
                // Revert Register button
                regBtn.classList.remove('btn-primary');
                regBtn.classList.add('btn-light', 'text-primary');
                
                themeToggleBtn.classList.remove('text-body');
                themeToggleBtn.classList.add('text-white');
                
                document.querySelector('.navbar-brand .lh-1 span').className = 'fw-bold d-block mb-0 h6 text-white';
                document.querySelector('.navbar-brand .lh-1 small').className = 'text-white-50 text-uppercase fw-semibold';
            }
        }
    </script>
