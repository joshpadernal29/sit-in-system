<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Cleaned Theme & Programmatic Menu Controller -->
<script>
    // 1. Programmatic Bootstrap Collapse Initializer (Bypasses double-loading issues)
    document.addEventListener("DOMContentLoaded", function () {
        const menuTarget = document.getElementById('mainNav');
        const menuToggler = document.getElementById('customNavbarToggler');

        if (menuTarget && menuToggler) {
            // Instantiate Bootstrap's built-in manual constructor directly
            const bsCollapse = new bootstrap.Collapse(menuTarget, { toggle: false });

            menuToggler.addEventListener('click', function () {
                bsCollapse.toggle();
            });
        }
    });

    // 2. Hybrid Theme Management Engine
    const htmlElement = document.documentElement;
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeIcon = document.getElementById('themeIcon');

    const mainNavbar = document.getElementById('mainNavbar');
    const navbarLinks = document.getElementById('navbarLinks');
    const regBtn = document.getElementById('regBtn');
    const loginLink = document.getElementById('loginLink');

    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    const initialTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
    setTheme(initialTheme);

    themeToggleBtn.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        setTheme(newTheme);
    });

    function setTheme(theme) {
        htmlElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);

        const brandTitle = document.querySelector('.navbar-brand .style-title');
        const brandSubtitle = document.querySelector('.navbar-brand .style-subtitle');

        if (theme === 'dark') {
            themeIcon.className = 'bi bi-sun-fill';
            themeToggleBtn.title = 'Switch to Light Mode';

            mainNavbar.classList.remove('bg-primary', 'navbar-dark');
            mainNavbar.classList.add('bg-body-tertiary', 'navbar-light');

            navbarLinks.style.setProperty('--bs-navbar-active-color', 'var(--bs-primary)');
            navbarLinks.style.setProperty('--bs-nav-underline-border-width', '3px');

            regBtn.classList.remove('btn-light', 'text-primary');
            regBtn.classList.add('btn-primary');

            themeToggleBtn.classList.remove('text-white');
            themeToggleBtn.classList.add('text-body');

            if (brandTitle) {
                brandTitle.classList.remove('text-white');
                brandTitle.classList.add('text-body');
            }
            if (brandSubtitle) {
                brandSubtitle.classList.remove('text-white-50');
                brandSubtitle.classList.add('text-body-secondary');
            }

            if (loginLink) {
                loginLink.classList.remove('text-white');
                loginLink.classList.add('text-body');
            }

        } else {
            themeIcon.className = 'bi bi-moon-stars-fill';
            themeToggleBtn.title = 'Switch to Dark Mode';

            mainNavbar.classList.remove('bg-body-tertiary', 'navbar-light');
            mainNavbar.classList.add('bg-primary', 'navbar-dark');

            navbarLinks.style.setProperty('--bs-navbar-active-color', '#fff');
            navbarLinks.style.setProperty('--bs-nav-underline-border-width', '3px');

            regBtn.classList.remove('btn-primary');
            regBtn.classList.add('btn-light', 'text-primary');

            themeToggleBtn.classList.remove('text-body');
            themeToggleBtn.classList.add('text-white');

            if (brandTitle) {
                brandTitle.classList.remove('text-body');
                brandTitle.classList.add('text-white');
            }
            if (brandSubtitle) {
                brandSubtitle.classList.remove('text-body-secondary');
                brandSubtitle.classList.add('text-white-50');
            }

            if (loginLink) {
                loginLink.classList.remove('text-body');
                loginLink.classList.add('text-white');
            }
        }
    }
</script>
